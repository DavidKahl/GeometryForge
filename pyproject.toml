[project]
name = "geometryforge"
version = "1.0.0"
description = "Agent-led native modeling, incremental validation, and local run inspection"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = ["numpy>=2,<3", "scipy>=1.15,<2", "trimesh>=4.6,<5", "networkx>=3,<4", "psutil>=7,<8", "pillow>=11,<13"]

[project.optional-dependencies]
viewer = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1"]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "build>=1,<2"]

[project.scripts]
geometryforge = "geometryforge.__main__:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["geometryforge*"]

[tool.setuptools.package-data]
geometryforge = ["skill/**/*", "skill/*", "web_dist/**/*", "web_dist/*", "examples/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
