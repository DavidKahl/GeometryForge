[targets.design]

[targets.game]
depends = ["design"]

[gates.calibration]
order = 0
kind = "calibration"
cameras = ["primary"]

[gates.master]
order = 1
parts = ["master_hull", "nacelle_master"]
checks = ["master_closed", "silhouette_primary", "silhouette_profile"]
[gates.master.review]
config = "reviews/master.json"
modes = ["zebra", "silhouette", "overlay"]
iou_views = ["ref_primary", "ref_profile"]
iou_min = 0.80

[gates.panels]
order = 2
parts = ["body_panels", "skirt", "belly", "nacelle_armor"]
checks = ["seam_doors_r", "seam_doors_l", "seam_fender_door_r", "seam_door_body_r", "seam_skirt_r23", "recess_windows_r", "recess_rear_panel", "recess_roof", "recess_nose", "recess_belly", "recess_bumper_rear", "recess_nacelle_r", "coverage_body", "coverage_nacelles"]
[gates.panels.review]
config = "reviews/panels.json"
modes = ["zebra", "glossy"]

[gates.detail]
order = 3
parts = ["pads", "nacelle_drive", "glass", "inserts", "roof_equipment", "interior"]
checks = ["mating_pad_fr", "mating_pad_fl", "mating_pad_rr", "mating_pad_rl", "mating_drum_r", "mating_shaft_r", "mating_coupling_r", "mating_drum_l", "mating_shaft_l", "mating_coupling_l", "glass_greenhouse_r", "glass_windshield", "lamps_nose", "lamps_tail", "exhaust_r", "silhouette_full_primary", "silhouette_full_profile"]
[gates.detail.review]
config = "reviews/detail.json"
modes = ["glossy", "silhouette", "overlay"]
iou_views = ["ref_primary", "ref_profile"]
# The locked Gate 1 proportions cap the full-assembly IoU near 0.84 (primary). Accepted by the user 2026-10-16: "Suggestions accepted and adjust the gate requirements to take it as it is for now."
iou_min = 0.83
