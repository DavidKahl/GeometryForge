format_version = 3

[project]
id = "hover_taxi_gated"
title = "Rain-soaked neon hover taxi (gated rebuild)"

[backends.blender]
entry = "models/blender.py"

[parts.master_hull]
sources = ["models/blender.py", "models/master_cage.py"]
parameters = ["master_levels"]

[parts.nacelle_master]
sources = ["models/blender.py", "models/master_cage.py"]
parameters = ["master_levels", "nacelle_y_mm", "nacelle_z_mm", "nacelle_width_mm", "nacelle_height_mm", "nacelle_chamfer_mm"]

[parts.body_panels]
sources = ["models/blender.py", "models/panels.py"]
parameters = ["panel_levels", "panel_styles", "pocket_specs", "panel_corner_mm"]
depends = ["master_hull"]

[parts.skirt]
sources = ["models/blender.py", "models/panels.py"]
parameters = ["panel_levels", "panel_styles", "pocket_specs", "panel_corner_mm"]
depends = ["master_hull"]

[parts.belly]
sources = ["models/blender.py", "models/panels.py"]
parameters = ["panel_levels", "panel_styles", "pocket_specs", "panel_corner_mm"]
depends = ["master_hull"]

[parts.nacelle_armor]
sources = ["models/blender.py", "models/panels.py"]
parameters = ["panel_levels", "panel_styles", "pocket_specs", "panel_corner_mm"]
depends = ["nacelle_master"]

[parts.pads]
sources = ["models/blender.py", "models/detail.py"]
parameters = ["pad_radius_mm", "pad_height_mm", "pad_lap_mm"]
depends = ["belly"]

[parts.nacelle_drive]
sources = ["models/blender.py", "models/detail.py"]
parameters = ["drum_lap_mm", "shaft_lap_mm", "coupling_lap_mm"]
depends = ["body_panels", "nacelle_armor", "nacelle_master"]

[parts.glass]
sources = ["models/blender.py", "models/detail.py"]
depends = ["body_panels", "master_hull"]

[parts.inserts]
sources = ["models/blender.py", "models/detail.py"]
depends = ["body_panels", "skirt", "nacelle_armor", "master_hull"]

[parts.roof_equipment]
sources = ["models/blender.py", "models/detail.py"]
parameters = ["sign_x_mm", "pod_x_mm", "pod_top_mm", "antenna_xy_mm"]
depends = ["master_hull"]

[parts.interior]
sources = ["models/blender.py", "models/detail.py"]
depends = ["master_hull"]

[checks.master_closed]
kind = "global"
parts = ["master_hull", "nacelle_master"]
[checks.master_closed.spec]
test = "open_edges"
targets = [{part = "master_hull", roles = ["guide"]}, {part = "nacelle_master", roles = ["guide"]}]

[checks.silhouette_primary]
kind = "global"
parts = ["master_hull", "nacelle_master"]
[checks.silhouette_primary.spec]
test = "silhouette_iou"
camera = "primary"
targets = [{part = "master_hull", roles = ["guide"]}, {part = "nacelle_master", roles = ["guide"]}]
[checks.silhouette_primary.thresholds]
# Gate 1 scores the master alone; the reference masks also contain pads, roof equipment and keel (Gates 2-3).
# Accepted by the user 2026-10-16: "Gate 1 IoU 0.80, keep profile proportions".
silhouette_iou_min = 0.80

[checks.silhouette_profile]
kind = "global"
parts = ["master_hull", "nacelle_master"]
[checks.silhouette_profile.spec]
test = "silhouette_iou"
camera = "profile"
targets = [{part = "master_hull", roles = ["guide"]}, {part = "nacelle_master", roles = ["guide"]}]
[checks.silhouette_profile.thresholds]
# Gate 1 scores the master alone; the reference masks also contain pads, roof equipment and keel (Gates 2-3).
# Accepted by the user 2026-10-16: "Gate 1 IoU 0.80, keep profile proportions".
silhouette_iou_min = 0.80

[checks.seam_doors_r]
kind = "seam"
parts = ["body_panels", "master_hull"]
[checks.seam_doors_r.spec]
a = {part = "body_panels", objects = ["Front door R"]}
b = {part = "body_panels", objects = ["Rear door R"]}
master = {part = "master_hull"}
[checks.seam_doors_r.thresholds]
# Painted seams vary ~2 mm along their length (narrow mid-seam, wider at three-panel corners); no single gap fits 2-4 mm.
# Accepted by the user 2026-10-16: "Gate 2: accept 1-5 as proposed, skirt flush for now".
gap_min_mm = 1.5
gap_max_mm = 4.5

[checks.seam_doors_l]
kind = "seam"
parts = ["body_panels", "master_hull"]
[checks.seam_doors_l.spec]
a = {part = "body_panels", objects = ["Front door L"]}
b = {part = "body_panels", objects = ["Rear door L"]}
master = {part = "master_hull"}
[checks.seam_doors_l.thresholds]
# Painted seams vary ~2 mm along their length; see seam_doors_r. Accepted by the user 2026-10-16 (Gate 2 decision 1).
gap_min_mm = 1.5
gap_max_mm = 4.5

[checks.seam_fender_door_r]
kind = "seam"
parts = ["body_panels", "master_hull"]
[checks.seam_fender_door_r.spec]
a = {part = "body_panels", objects = ["Fender R"]}
b = {part = "body_panels", objects = ["Front door R"]}
master = {part = "master_hull"}
[checks.seam_fender_door_r.thresholds]
# Painted seams vary ~2 mm along their length; see seam_doors_r. Accepted by the user 2026-10-16 (Gate 2 decision 1).
gap_min_mm = 1.5
gap_max_mm = 4.5

[checks.seam_door_body_r]
kind = "seam"
parts = ["body_panels", "master_hull"]
[checks.seam_door_body_r.spec]
a = {part = "body_panels", objects = ["Rear door R"]}
b = {part = "body_panels", objects = ["Rear body R"]}
master = {part = "master_hull"}
[checks.seam_door_body_r.thresholds]
# Painted seams vary ~2 mm along their length; see seam_doors_r. Accepted by the user 2026-10-16 (Gate 2 decision 1).
gap_min_mm = 1.5
gap_max_mm = 4.5

[checks.seam_skirt_r23]
kind = "seam"
parts = ["master_hull", "skirt"]
[checks.seam_skirt_r23.spec]
a = {part = "skirt", objects = ["Skirt plate R2"]}
b = {part = "skirt", objects = ["Skirt plate R3"]}
master = {part = "master_hull"}
[checks.seam_skirt_r23.thresholds]
# Chrome skirt plates are separate layered plates with visible gaps (quality bar), wider than painted panel seams.
gap_min_mm = 3.0
gap_max_mm = 9.0
# The seam's lower end runs into the creased belly corner, where the two plates' curvature differs over the probe.
# Accepted by the user 2026-10-16 (Gate 2 decision 4).
curvature_ratio = 0.6

[checks.recess_windows_r]
kind = "recess"
parts = ["body_panels", "master_hull"]
[checks.recess_windows_r.spec]
panel = {part = "body_panels", objects = ["Greenhouse R"]}
master = {part = "master_hull"}
region_mm = [[-2050, -1300, 0], [1200, 0, 3000]]
[checks.recess_windows_r.thresholds]
# Glazing openings get frames and glass in Gate 3; their returns turn tighter than painted body openings.
# Accepted by the user 2026-10-16 (Gate 2 decision 2).
fillet_min_mm = 0.8

[checks.recess_rear_panel]
kind = "recess"
parts = ["body_panels", "master_hull"]
[checks.recess_rear_panel.spec]
panel = {part = "body_panels", objects = ["Rear panel"]}
master = {part = "master_hull"}

[checks.recess_roof]
kind = "recess"
parts = ["body_panels", "master_hull"]
[checks.recess_roof.spec]
panel = {part = "body_panels", objects = ["Roof"]}
master = {part = "master_hull"}

[checks.recess_nose]
kind = "recess"
parts = ["body_panels", "master_hull"]
[checks.recess_nose.spec]
panel = {part = "body_panels", objects = ["Nose"]}
master = {part = "master_hull"}
[checks.recess_nose.thresholds]
# Headlamp openings get lenses in Gate 3; three vertices at the bumper-top crease stand 0.10 mm proud.
# Accepted by the user 2026-10-16 (Gate 2 decisions 2 and 5).
fillet_min_mm = 0.8
protrusion_mm = 0.15

[checks.recess_belly]
kind = "recess"
parts = ["belly", "master_hull"]
[checks.recess_belly.spec]
panel = {part = "belly", objects = ["Belly"]}
master = {part = "master_hull"}

[checks.recess_bumper_rear]
kind = "recess"
parts = ["master_hull", "skirt"]
[checks.recess_bumper_rear.spec]
panel = {part = "skirt", objects = ["Rear bumper"]}
master = {part = "master_hull"}
[checks.recess_bumper_rear.thresholds]
# Tail light openings get lenses in Gate 3. Accepted by the user 2026-10-16 (Gate 2 decision 2).
fillet_min_mm = 0.8

[checks.recess_nacelle_r]
kind = "recess"
parts = ["nacelle_armor", "nacelle_master"]
[checks.recess_nacelle_r.spec]
panel = {part = "nacelle_armor", objects = ["Nacelle armor R"]}
master = {part = "nacelle_master", objects = ["Nacelle master R"]}

[checks.coverage_body]
kind = "global"
parts = ["belly", "body_panels", "master_hull", "skirt"]
[checks.coverage_body.spec]
test = "coverage"
master = {part = "master_hull"}
panels = [{part = "body_panels"}, {part = "skirt"}, {part = "belly"}]
openings = [{part = "body_panels", roles = ["interface"]}, {part = "skirt", roles = ["interface"]}, {part = "belly", roles = ["interface"]}]
[checks.coverage_body.thresholds]
# Panels subdivide one level below the master; at sharp creased cage corners chords sag up to ~8.8 mm.
# Accepted by the user 2026-10-16 (Gate 2 decision 3).
cover_tolerance_mm = 9.0

[checks.coverage_nacelles]
kind = "global"
parts = ["nacelle_armor", "nacelle_master"]
[checks.coverage_nacelles.spec]
test = "coverage"
master = {part = "nacelle_master"}
panels = [{part = "nacelle_armor"}]
openings = [{part = "nacelle_armor", roles = ["interface"]}]
[checks.coverage_nacelles.thresholds]
# Chord sag at the creased rear-face octagon corners, up to ~7.6 mm. Accepted by the user 2026-10-16 (Gate 2 decision 3).
cover_tolerance_mm = 9.0

[checks.mating_pad_fr]
kind = "mating"
parts = ["belly", "pads"]
[checks.mating_pad_fr.spec]
parent = {part = "belly", objects = ["_interface_pad_fr_seat"]}
child = {part = "pads", objects = ["_mate_pad_fr"]}
skin = [{part = "belly", objects = ["Belly"]}]
child_solids = [{part = "pads", objects = ["Pad FR shell", "Pad FR boss", "Pad FR gusset 0", "Pad FR gusset 1", "Pad FR gusset 2", "Pad FR gusset 3"]}]
[checks.mating_pad_fr.thresholds]
# The boss engages 40 mm past the bay seat; window 20-80 mm. Accepted by the user 2026-10-16: "Suggestions accepted and adjust the gate requirements to take it as it is for now."
lap_min_mm = 20
lap_max_mm = 80

