format_version = 1

[project]
runtime = ["Blender 5.x", "GeometryForge mesh and render extras"]
requires_geometryforge = ">=0.3,<0.4"
title = "Office Led Hub V2"
id = "office_led_hub_v2"
backend = "blender"
build = "models/hub.py"
checks = ["checks/verify_hub.py"]

[print]
bed_mm = [256, 256]
nozzle_mm = 0.4
minimum_wall_mm = 2.4

[parameters.cable_diameter]
type = "number"
default = 7.0
label = "Cable Diameter"
units = "mm"
min = 6.5
max = 7.5

[parameters.cable_clearance]
type = "number"
default = 0.6
label = "Cable Clearance"
units = "mm"
min = 0.4
max = 0.8
